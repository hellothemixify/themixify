<!--
  The shared shell for every authentication email.

  This is not the place for the CSS the website uses. Email clients are twenty
  years behind browsers and disagree with each other: Outlook renders through
  Word, Gmail strips <style> blocks on forwarded mail, and none of them can be
  relied on for flexbox, grid, custom properties or web fonts. So everything
  here is a table, every style is inline, and the colours are literals copied
  from app/globals.css rather than variables — the same palette, hard-coded,
  because there is no other way to carry it into an inbox.

  The gradient bar degrades to solid brand purple wherever gradients are not
  supported, which is why the bgcolor attribute is set as well as the style.

  Not a template Supabase reads. It is the reference the four real templates in
  this directory are built from, kept so the next person changing one of them
  can see the intent rather than reverse-engineering it from four copies.
  Paste the real ones into Authentication -> Emails in the Supabase dashboard.

  Placeholders Supabase substitutes:
    {{ .ConfirmationURL }}  the action link
    {{ .Email }}            the recipient
    {{ .NewEmail }}         the proposed address, on an email change
    {{ .SiteURL }}          https://themixify.com
    {{ .Token }}            the six-digit code, if you prefer codes to links
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Themixify</title>
  </head>
  <body style="margin:0; padding:0; background-color:#fbf8ff;">
    <!-- Preview text: the line the inbox shows next to the subject. The spacer
         after it stops the client from padding it out with body copy. -->
    <div style="display:none; max-height:0; overflow:hidden; opacity:0;">
      PREVIEW_TEXT
      &#847;&zwnj;&nbsp;&#8199;&shy;&#847;&zwnj;&nbsp;&#8199;&shy;&#847;&zwnj;&nbsp;&#8199;&shy;
    </div>

    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      border="0"
      style="background-color:#fbf8ff;"
    >
      <tr>
        <td align="center" style="padding:32px 16px;">
          <table
            role="presentation"
            width="100%"
            cellpadding="0"
            cellspacing="0"
            border="0"
            style="max-width:520px; background-color:#ffffff; border:1px solid #ece6f7; border-radius:20px; overflow:hidden;"
          >
            <!-- The brand sweep, same three stops as the logo -->
            <tr>
              <td
                bgcolor="#8b5cf6"
                height="5"
                style="height:5px; line-height:5px; font-size:0; background-color:#8b5cf6; background-image:linear-gradient(100deg,#8b5cf6 0%,#ec4899 52%,#f97316 100%);"
              >
                &nbsp;
              </td>
            </tr>

            <tr>
              <td style="padding:36px 40px 8px 40px;">
                <div
                  style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:19px; font-weight:800; letter-spacing:-0.02em; color:#120a20;"
                >
                  Themixify
                </div>
              </td>
            </tr>

            <tr>
              <td style="padding:16px 40px 0 40px;">
                <h1
                  style="margin:0 0 12px 0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:26px; line-height:1.2; font-weight:800; letter-spacing:-0.02em; color:#120a20;"
                >
                  HEADING
                </h1>
                <p
                  style="margin:0 0 24px 0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:15px; line-height:1.65; color:#453a5c;"
                >
                  BODY
                </p>
              </td>
            </tr>

            <!-- Bulletproof-ish button: a table cell with a background colour,
                 because a styled <a> alone collapses in Outlook. -->
            <tr>
              <td style="padding:0 40px 28px 40px;">
                <table role="presentation" cellpadding="0" cellspacing="0" border="0">
                  <tr>
                    <td
                      bgcolor="#7439e0"
                      style="border-radius:999px; background-color:#7439e0; background-image:linear-gradient(100deg,#8b5cf6 0%,#ec4899 100%);"
                    >
                      <a
                        href="{{ .ConfirmationURL }}"
                        style="display:inline-block; padding:14px 30px; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:15px; font-weight:700; color:#ffffff; text-decoration:none; border-radius:999px;"
                      >
                        BUTTON_LABEL
                      </a>
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Every client that blocks the button still shows this. -->
            <tr>
              <td style="padding:0 40px 28px 40px;">
                <p
                  style="margin:0 0 6px 0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:12px; line-height:1.6; color:#6b6285;"
                >
                  Or paste this into your browser:
                </p>
                <p
                  style="margin:0; font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:12px; line-height:1.6; word-break:break-all; color:#7439e0;"
                >
                  {{ .ConfirmationURL }}
                </p>
              </td>
            </tr>

            <tr>
              <td style="padding:0 40px;">
                <div style="height:1px; line-height:1px; font-size:0; background-color:#ece6f7;">&nbsp;</div>
              </td>
            </tr>

            <tr>
              <td style="padding:22px 40px 34px 40px;">
                <p
                  style="margin:0 0 10px 0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:12.5px; line-height:1.65; color:#6b6285;"
                >
                  FOOTNOTE
                </p>
                <p
                  style="margin:0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; font-size:12.5px; line-height:1.65; color:#6b6285;"
                >
                  Themixify — the zero-plugin, agentic-optimized WordPress theme.<br />
                  <a href="{{ .SiteURL }}" style="color:#7439e0; text-decoration:none;">themixify.com</a>
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
