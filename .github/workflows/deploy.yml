name: Deploy to Cloudflare

# Every push to main ships. Pull requests are built but not deployed, so a
# broken branch fails loudly before it can reach production.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A newer push supersedes an in-flight one — never race two deploys onto the
  # same Worker.
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # These two are inlined rather than kept as secrets on purpose: NEXT_PUBLIC_*
    # values are compiled into the browser bundle, so they are already public the
    # moment the site is served. Treating them as secrets would imply a
    # confidentiality the anon key does not have — it is protected by row-level
    # security in Postgres, not by being hidden.
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://ynwxgdjbhjbfgwwuyqxt.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_aODzmM4LWm0t5CEVg9wcGA_0K1CfXUl

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build the Worker bundle
        run: npx opennextjs-cloudflare build

      # Deploy only from main. A pull request stops at the build, which is the
      # useful half — it tells you the branch compiles without letting it ship.
      - name: Deploy to Cloudflare
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: c43d9ba86a3d1062e39830d397fbbef1
